name: Release

on:
  release:
    types: [created]
  # Manual runs build every target without uploading (for testing packaging
  # changes on a branch); uploads are gated on the release event.
  workflow_dispatch:

permissions:
  contents: write   # needed for gh release upload

jobs:
  build-macos-aarch64:
    name: macOS AArch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bn-app -> ../../target

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        working-directory: crates/bn-app
        run: dx bundle --release

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/dx/balina/bundle/macos/macos/*.dmg \
            --clobber

  build-linux-flatpak:
    name: Linux Flatpak (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      # Must match runtime-version in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.alinatudoran.balina.yml
          bundle: balina-${{ matrix.arch }}.flatpak
          artifact-name: flatpak-${{ matrix.arch }}
          arch: ${{ matrix.arch }}
          branch: stable
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}

  # Separate job: the flatpak container image has no gh CLI.
  upload-linux-flatpak:
    name: Upload Linux Flatpaks
    needs: build-linux-flatpak
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            balina-*.flatpak \
            --repo "${{ github.repository }}" \
            --clobber

  build-windows-amd64:
    name: Windows AMD64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/bn-app -> ../../target

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli --no-confirm --locked

      - name: Bundle
        working-directory: crates/bn-app
        run: dx bundle --release

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            target/dx/balina/bundle/windows/nsis/*.exe \
            --clobber
